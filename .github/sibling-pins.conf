# Which sibling COMMIT qontinui-supervisor compiles and tests against.
#
# Format: one entry per line, `<owner>/<repo>` <whitespace> `<40-hex-sha>`.
# Blank lines and `#` comments are ignored. Same format as qontinui-runner's and
# qontinui-coord's `.github/sibling-pins.conf`.
#
# READ BY `.github/scripts/schemas-pin.sh`, and only by it, from both ci.yml
# checkout steps.
#
# WHY: Cargo.lock records a path dependency's VERSION but no COMMIT. While CI
# cloned schemas MAIN, every qontinui-types release left this repo's lock stale
# (supervisor#189 hand-fixed 2.0.0). Pinned, a schemas release reaches supervisor
# only through a PR that moves THIS LINE AND Cargo.lock IN THE SAME COMMIT, and
# ci.yml's `cargo metadata --locked` step proves the pair on that PR.
#
# HOW IT MOVES:
#   - automatically: `.github/workflows/schemas-pin-bump.yml` opens ONE PR on
#     `chore/schemas-pin-bump` carrying the new SHA plus the lock refresh.
#   - by hand, when a supervisor change needs a newer schemas commit:
#     `bash .github/scripts/schemas-pin.sh rewrite <landed sha>`, then
#     `bash .github/scripts/schemas-pin.sh checkout ..`, run
#     `cargo metadata --format-version 1 > /dev/null`, and commit both files.
#
# Plan: qontinui-dev-notes plans/2026-08-31-schemas-releases-strand-consumer-cargo-locks.md §7.4.
