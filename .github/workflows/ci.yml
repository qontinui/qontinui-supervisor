name: CI

# The merge-candidate/** globs below are load-bearing, not decorative: coord
# validates a land by pushing the rebased tip to
# refs/heads/merge-candidate/<proposal_id> (or the -spec/-batch variants) and
# waiting for that ref's CI before merging. Without a matching push trigger the
# candidate push matches no workflow, no checks are ever reported, and the
# proposal livelocks waiting on a run that will never start — the 2026-06-13
# qontinui-runner #566 incident class. Same spelling qontinui-runner uses.
on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  # Unfiltered on purpose. A PR based on another PR's head branch (a stacked
  # PR) is still a PR whose tree coord may be asked to land, and a
  # `branches: [main]` filter silently gives it ZERO checks — the structural
  # CI gap plan 2026-08-23-stacked-pr-ci-parity Phase 5 closes. That plan
  # scoped Phase 5 to ui-bridge and qontinui-runner and left this repo on
  # Phase 4 (the merge-candidate globs above) alone, so supervisor was the
  # one repo that got the candidate lane without the PR lane. Broadening
  # rather than adding a separate fast lane is the ui-bridge arm of Phase 5,
  # and it applies here for the same reason: this repo is PUBLIC, so Actions
  # minutes are unbilled, and a full pass is ~6 wall-clock minutes.
  pull_request:
  # schemas-pin-bump.yml dispatches this workflow on its bump branch: a
  # GITHUB_TOKEN push fires no pull_request run.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Where the four Linux jobs run ───────────────────────────────────────
  #
  # On every run that is NOT a pull_request (main and merge-candidate*/**
  # pushes, workflow_dispatch) this job decides whether `Rust Check`,
  # `Compose Parity`, `CI script tests` and `Frontend Check` run on the
  # self-hosted pool `[self-hosted, Linux, X64, ram-16g]` or on the free
  # GitHub-hosted `ubuntu-latest` floor. This file never routes a pull_request
  # run, and this job is skipped on one. That alone does not keep a fork's
  # code off the pool: a pull_request run uses the PR's own copy of this file,
  # so a fork could rewrite `runs-on`. What stops it is the repo's fork-PR
  # approval policy, `all_external_contributors`: no outside contributor's run
  # starts until a maintainer approves it. Never approve a fork run whose diff
  # touches `.github/`.
  #
  # THE POOL, read 2026-11-03: four registrations on nawa (Debian 13),
  # `nawa-sup-1..4`, registered to THIS repo. The org's only runner group does
  # not admit public repos, so no other self-hosted runner can take these
  # jobs. Each is its own systemd unit in ci-runners.slice (MemoryHigh 60 GiB,
  # MemoryMax 64 GiB, PrivateTmp=yes, per `systemctl show`), and all four run
  # as the host's one `runner` account, which is in no sudo group.
  #
  # WHY. The org is on GitHub Free: about 20 concurrent hosted jobs
  # org-wide, shared with every public repo's PR CI, and coord's land of a
  # PR waits on its merge-candidate run. Measured 2026-11-03 over ~12
  # merge-candidate push runs: this repo's jobs waited p90 22.6 min (max
  # 31.6) for a hosted runner, against run times of 0.2-12.1 min, and the run
  # wall p90 was 32.2 min. The cost under `auto`: the four jobs wait for
  # this job, which itself needs a hosted runner. That is seconds when
  # hosted runners are free, but under a saturated hosted queue it waits
  # like any hosted job (qontinui-runner's `route` sat queued 10 m 40 s on
  # 2026-11-03, run 41646964958). A forced lane skips this job entirely.
  #
  # The decision is the fleet's route-with-a-hosted-floor router: a VERBATIM
  # copy of qontinui-claude-config `scripts/route-ci-lane.py` (blob c67b16e7;
  # its hermetic test is `scripts/route-ci-lane-test.py` there). Re-sync by
  # copying the file again and checking `git hash-object` against ccfg's
  # blob, never by editing it here. With `actions: read` it reads THIS
  # repo's queued jobs and routes to the floor when the pool is STALLED (a
  # pool job queued >= 10 min), SATURATED (>= 4 queued) or its signal is
  # unreadable. The repo variable picks the lane:
  #
  #   SUPERVISOR_CI_LINUX_LANE = auto         this job runs and decides
  #                            = self-hosted  this job is SKIPPED; the four
  #                                           jobs go to the pool with no
  #                                           overflow (a dead pool holds
  #                                           them until GitHub cancels a
  #                                           self-hosted job queued 24 h)
  #                            = hosted | unset | anything else
  #                                           this job is SKIPPED; the four
  #                                           jobs run hosted (kill switch)
  #
  # Setting the lane only moves runs created afterwards. To free a run stuck
  # on the pool, cancel it and re-run it: a re-run goes hosted.
  #
  # RE-RUNS GO TO THE FLOOR, and each job's `runs-on` decides that, not this
  # job. A pool that picks jobs up and then fails them reads healthy to the
  # queue signal, so a retry must not land on it again. coord retries with
  # "re-run failed jobs", which does not re-run a `route` that succeeded, so
  # the router's own `--hosted-on-rerun` never fires for coord's retries:
  # `runs-on` reads `needs.route.outputs.labels` only on attempt 1.
  #
  # The router ALWAYS exits 0 with outputs written, and the four jobs run
  # under `!cancelled()` with a hosted fallback, so a route job that fails,
  # times out or is skipped leaves them on the floor (or, forced, on the
  # pool), never SKIPPED, which coord's check classification would count as
  # passing. Their names are unchanged: they are the required check contexts.
  route:
    if: ${{ github.event_name != 'pull_request' && vars.SUPERVISOR_CI_LINUX_LANE == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      labels: ${{ steps.route.outputs.labels }}
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route the four Linux jobs
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERVISOR_CI_LINUX_LANE: ${{ vars.SUPERVISOR_CI_LINUX_LANE }}
          SUPERVISOR_CI_LINUX_LANE_SOURCE: repo variable SUPERVISOR_CI_LINUX_LANE
          SUPERVISOR_CI_LINUX_HOSTED_LABEL: ubuntu-latest
          SUPERVISOR_CI_LINUX_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -B .github/scripts/route-ci-lane.py
          --self-hosted-labels self-hosted,Linux,X64,ram-16g
          --env-prefix SUPERVISOR_CI_LINUX
          --title "Linux jobs"
          --default-lane hosted
          --hosted-on-rerun

  rust-check:
    name: Rust Check
    # `route` decides where this runs (see above). `!cancelled()` is
    # load-bearing: on a pull_request `route` is SKIPPED, and without it a job
    # that needs a skipped job is skipped too, which would turn every required
    # check below into `skipped` (= passing to coord) on every PR.
    needs: route
    if: ${{ !cancelled() }}
    # The pool on a FIRST attempt of a run that is not a pull_request, when the
    # lane is forced `self-hosted` or `route` said so under `auto` (its `labels`
    # output); everything else is the hosted floor: a pull_request, any re-run,
    # the `hosted`/unset lane, and a `route` that produced nothing. The pool
    # label set is spelled in nine places: this expression and the same one on
    # the three jobs below, the four `# coord-pools:` lines, and `route`'s
    # --self-hosted-labels. Change them together, because the router counts
    # only jobs carrying EXACTLY that set; `CI script tests` fails on drift
    # (.github/scripts/check-ci-lane-labels.py). ram-16g is the class at or above
    # this job's peak: a cold `cargo build --all-targets` of this crate at
    # CARGO_BUILD_JOBS=20, run on nawa 2026-11-03 inside a transient
    # `systemd-run --user --scope`, peaked at 13.2 GiB of that scope's
    # memory.peak (page cache included; 4.7 GiB anonymous).
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON((github.run_attempt == 1 && github.event_name != 'pull_request' && vars.SUPERVISOR_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]') || (github.run_attempt == 1 && needs.route.outputs.labels) || '["ubuntu-latest"]') }}

    steps:
      # persist-credentials: false because no later step needs git auth, and
      # on the pool, while the job runs, a persisted token would sit in a
      # .git/config every other registration's job can read (one account,
      # one home). The same holds for every checkout in the four routed jobs.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # SELF-HOSTED ONLY (`route` put this job on the pool). What a hosted VM
      # hands every job and a persistent host has to be told:
      #
      #   1. A WORKING HOST. A tool this job needs that the host lacks fails
      #      HERE, in a second, naming the runner. That red is the host's, not
      #      the change's, and a re-run goes hosted. lsof and python3 are what
      #      the orphan-kill suite below exercises the kill primitives with;
      #      without them it would fail ~10 minutes in.
      #   2. A HOME of its own, and a rustup of the registration's own. Every
      #      registration on the host runs as ONE account with ONE home, so
      #      the job gets HOME and TMPDIR under $RUNNER_TEMP, which the runner
      #      empties per job. CARGO_HOME stays on the account's persistent
      #      registry, which cargo locks itself. RUSTUP_HOME does not: the
      #      toolchain step runs `rustup default`, which on the account's
      #      shared RUSTUP_HOME rewrites the settings every other job on the
      #      host reads. One registration runs one job at a time, so a
      #      RUSTUP_HOME per registration, beside its target below, has no
      #      concurrent writer; it downloads 1.95.0 once per registration.
      #      This runs before the toolchain step, which finds rustup through
      #      CARGO_HOME.
      #   3. A PERSISTED SIBLING. The runner keeps $GITHUB_WORKSPACE/..
      #      between jobs, and the sibling checkout below reuses the
      #      ../qontinui-schemas there: re-cloning it would reset the mtimes
      #      of its two path-dependency crates and rebuild both on every job.
      #      A checkout that fails, e.g. on a git lock left by a job killed
      #      mid-fetch, is retried once from an empty directory.
      #   4. A MEMORY-DERIVED COMPILE CAP. cargo's default parallelism is
      #      nproc, 128 rustc on nawa. CARGO_BUILD_JOBS is the smallest of
      #      MemTotal and every cgroup memory.max/memory.high above this job,
      #      / 3 GiB, clamped to nproc, and 1 at or below 8 GiB: 20 on a nawa
      #      unit, measured at a 13.2 GiB peak (see `runs-on`).
      #      RUST_TEST_THREADS is 4, the hosted VM's nproc and so libtest's
      #      default there, so the suite's concurrency does not change with
      #      the machine it lands on.
      #   5. A PERSISTENT TARGET. actions/checkout cleans with `git clean
      #      -ffdx`, which deletes ./target on every job. So the target lives
      #      under the account's persistent home, ONE per registration (two
      #      jobs never share a cargo build lock), and ./target is a symlink to
      #      it: the clean removes the link, never the tree behind it.
      #      CARGO_TARGET_DIR is deliberately not set. It saves CPU on a
      #      shared host, not wall time. Warm (run 41699811297), this job
      #      compiled 6 units, all of them this crate, where a cold run
      #      compiled 583, but it took as long: this crate's own lib, bin and
      #      test binaries rebuild every run, and the tests' execution
      #      dominates. Bounded: a target over
      #      40 GiB (a full Rust Check leaves about 7 GiB), under 60 GiB free
      #      on its filesystem, or unreadable, starts cold. dist/ and
      #      frontend/node_modules stay in the workspace, so the clean still
      #      hands the no-dist step below the fresh tree it requires, and
      #      build.rs reruns for an absent dist/.
      - name: "Self-hosted: host check, own HOME and rustup, compile caps and the persistent target"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for tool in cc git curl python3 lsof npm; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error title=self-hosted host not provisioned::runner '$RUNNER_NAME' lacks:$missing. The HOST is at fault, not this change: provision it. A re-run goes to the hosted floor; SUPERVISOR_CI_LINUX_LANE=hosted keeps new runs off the pool."
            exit 1
          fi

          pool_home="$HOME"
          state="$pool_home/.cache/qontinui-supervisor-ci/$RUNNER_NAME"
          job_home="$RUNNER_TEMP/home"
          mkdir -p "$state/rustup" "$job_home" "$RUNNER_TEMP/tmp"

          budget_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          cg="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "$cg" != "/sys/fs/cgroup" ] && [ -n "$cg" ]; do
            for f in memory.max memory.high; do
              v=$(cat "$cg/$f" 2>/dev/null || echo max)
              case "$v" in ''|*[!0-9]*) continue ;; esac
              if [ $((v / 1024)) -lt "$budget_kb" ]; then budget_kb=$((v / 1024)); fi
            done
            cg="${cg%/*}"
          done
          cpus=$(nproc)
          jobs=$(( budget_kb / 3145728 ))
          [ "$budget_kb" -gt 8388608 ] || jobs=1
          [ "$jobs" -ge 1 ] || jobs=1
          [ "$jobs" -le "$cpus" ] || jobs=$cpus
          threads=4
          [ "$threads" -le "$cpus" ] || threads=$cpus

          {
            echo "CARGO_HOME=${CARGO_HOME:-$pool_home/.cargo}"
            echo "RUSTUP_HOME=$state/rustup"
            echo "HOME=$job_home"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "CARGO_BUILD_JOBS=$jobs"
            echo "RUST_TEST_THREADS=$threads"
          } >> "$GITHUB_ENV"
          echo "HOME -> $job_home; CARGO_HOME stays in $pool_home; RUSTUP_HOME and the target are this registration's, under $state"
          echo "memory budget $((budget_kb / 1048576)) GiB, nproc $cpus -> CARGO_BUILD_JOBS=$jobs RUST_TEST_THREADS=$threads"

          cache="$state/target"
          mkdir -p "$cache"
          if ! used_kb=$(du -sk "$cache" 2>/dev/null | cut -f1) || [ -z "$used_kb" ]; then
            echo "::notice title=persistent target reset::du could not read $cache: starting cold"
            chmod -R u+rwX "${cache:?}" 2>/dev/null || true
            rm -rf "${cache:?}"
            mkdir -p "$cache"
            used_kb=0
          fi
          free_kb=$(df -Pk "$cache" | awk 'NR == 2 {print $4}')
          if [ "$used_kb" -gt $((40 * 1048576)) ] || [ "$free_kb" -lt $((60 * 1048576)) ]; then
            echo "::notice title=persistent target reset::$((used_kb / 1048576)) GiB used, $((free_kb / 1048576)) GiB free on its filesystem: starting cold"
            chmod -R u+rwX "${cache:?}" 2>/dev/null || true
            rm -rf "${cache:?}"
            mkdir -p "$cache"
            used_kb=0
          fi
          if [ -e target ] && [ ! -L target ]; then rm -rf target; fi
          ln -sfn "$cache" target
          echo "target -> $cache ($((used_kb / 1048576)) GiB already built)"

      # qontinui-supervisor's Cargo.toml declares qontinui-types as a path: dep
      # at ../qontinui-schemas/rust. Without the sibling checkout, clippy + tests
      # fail with "failed to read ../qontinui-schemas/rust/Cargo.toml".
      # PINNED: the commit comes from .github/sibling-pins.conf, not schemas main
      # (plan 2026-08-31-schemas-releases-strand-consumer-cargo-locks §7.4 Phase 3b).
      # On the pool the previous job's copy persists at $GITHUB_WORKSPACE/..
      # and is reused (schemas-pin.sh fetches by sha, force-checks-out and
      # cleans it), so cargo keeps its path-dependency crates fresh. A pin
      # the script refuses fails first, leaving the copy alone. A checkout
      # that fails, e.g. on a git lock left by a job killed mid-fetch, has
      # the copy removed and is retried once.
      - name: Checkout sibling repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A refusal of the pin itself fails here, with the copy untouched.
          bash .github/scripts/schemas-pin.sh read > /dev/null
          rc=0
          bash .github/scripts/schemas-pin.sh checkout "$GITHUB_WORKSPACE/.." || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=schemas sibling checkout failed::exit $rc; removing ../qontinui-schemas and retrying once"
            rm -rf "${GITHUB_WORKSPACE:?}/../qontinui-schemas"
            bash .github/scripts/schemas-pin.sh checkout "$GITHUB_WORKSPACE/.."
          fi

      # Pin matches rust-toolchain.toml (channel = "1.95.0"). The toolchain
      # file overrides any other channel for every cargo invocation, so the
      # rustfmt/clippy components must be installed for 1.95.0 specifically —
      # otherwise `cargo fmt`/`cargo clippy` auto-switch to a component-less
      # 1.95.0 and fail with "'cargo-fmt' is not installed".
      - name: Install Rust 1.95.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # The pinned schemas commit must be ON schemas main, and Cargo.lock must
      # match the tree it pins (plan 2026-08-31-schemas-releases-strand-consumer-cargo-locks
      # §7.4 Phase 3b). Both run before any cargo build: a build silently rewrites
      # a stale lock, after which --locked passes vacuously.
      - name: Pinned qontinui-schemas commit is on schemas main
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/schemas-pin.sh verify-landed

      - name: Cargo.lock is in sync with the pinned qontinui-schemas
        timeout-minutes: 10
        shell: bash
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null; then
            exit 0
          fi
          echo "::error title=Cargo.lock is stale::Committed Cargo.lock does not match the graph resolved against the pinned qontinui-schemas sibling."
          cargo metadata --format-version 1 > /dev/null || true
          git --no-pager diff -- Cargo.lock || true
          echo "Fix: move the pin and the lock in the SAME commit: bash .github/scripts/schemas-pin.sh checkout .. && cargo metadata --format-version 1 > /dev/null, then commit .github/sibling-pins.conf with Cargo.lock."
          git checkout -- Cargo.lock || true
          exit 1

      # Hosted only. A pool job builds in its registration's persistent target
      # and keeps the registry in the account's CARGO_HOME (both set up above),
      # so a restore would only unpack into a per-job HOME nobody keeps. And it
      # must never SAVE: the key carries the OS but not the distro, so an entry
      # a Debian 13 pool host saved on a main push would be restored by the next
      # hosted ubuntu run, its build-script and proc-macro binaries linked
      # against a newer glibc than the hosted image has.
      - name: Cache cargo dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # tests/machine_local_artifacts.rs cross-checks its hard-coded copy of
      # qontinui-runner's MANAGED_REPO_EXCLUDES against the runner's own
      # declaration. Without this step that check has no source in CI, so it
      # ran only on developer boxes — each against whatever ITS sibling
      # checkout happened to have fetched. On 2026-09-05, against one and the
      # same qontinui-runner origin/main, that produced three answers: PASS on
      # a box 337 commits behind (certifying a drift that had already
      # happened), FAIL on a current one (which produced ca98051, reconciling
      # the roster), and SKIP here. Every CI run on main between #168 and
      # ca98051 was green while this check was skipping — which is why
      # ca98051 describes a failure "on main" that no CI run ever saw.
      #
      # Sparse + depth 1: what is wanted is the MANAGED_REPO_EXCLUDES
      # declaration, not the runner tree. actions/checkout takes the repo's
      # default branch, which is the origin/main the test wants.
      #
      # qontinui-runner is PUBLIC, so this needs no secret — the same
      # constraint that pushed the cross-repo half of compose-parity into
      # coord's CI (see that job's comment). If it ever goes private this step
      # fails and roster_matches_the_runner_definition then hard-fails on a
      # missing source. That direction is deliberate: red, never silently green.
      #
      # The same checkout carries src-tauri/src/instance_env.rs for
      # tests/root_confined_env_keys.rs, which holds this repo's copy of the
      # runner's ROOT_CONFINED_ENV_KEYS (src/process/instance_root.rs) to the
      # runner's own list. In CI that test REQUIRES the file named by
      # $QONTINUI_RUNNER_INSTANCE_ENV_RS: the copy had drifted (it lacked
      # QONTINUI_TOUCH_LEDGER_DIR, coord finding 7a74f9f1) with nothing to see it.
      - name: Check out qontinui-runner's roster declaration
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-runner
          path: .runner-roster
          sparse-checkout: |
            src-tauri/src/fleet.rs
            src-tauri/src/instance_env.rs
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --check

      # build.rs builds dist/ with npm, and when npm fails the crate must still
      # compile and serve static/dashboard.html: `Assets` is
      # `#[allow_missing = true]` (src/routes/dashboard.rs). Without it, the
      # derive fails on a missing dist/ and the crate does not compile. Until
      # 2026-10-28 that was every fresh worktree on a standard Windows Node.js
      # install (build.rs spawned a bare `npm`, which Windows did not find),
      # and nothing here saw it, because this job has npm and so always builds
      # a dist/. A fresh checkout has no dist/ and no frontend/node_modules, so
      # the step puts a failing `npm` first on PATH. It must run BEFORE the
      # clippy step, whose build.rs run produces dist/.
      - name: The crate compiles when npm fails and there is no dist/
        shell: bash
        run: |
          set -euo pipefail
          if [ -e dist ] || [ -e frontend/node_modules ]; then
            echo "::error::dist/ or frontend/node_modules exists before any build, so this step cannot test their absence"
            exit 1
          fi
          shim="$RUNNER_TEMP/failing-npm"
          mkdir -p "$shim"
          printf '#!/bin/sh\necho "failing npm shim: $*" >&2\nexit 1\n' > "$shim/npm"
          chmod +x "$shim/npm"
          PATH="$shim:$PATH" cargo check --lib 2>&1 | tee "$RUNNER_TEMP/no-dist-check.out"
          grep -q 'SPA will not be embedded' "$RUNNER_TEMP/no-dist-check.out" \
            || { echo "::error::build.rs did not report the fallback, so the failing npm never ran"; exit 1; }
          if [ -e dist ]; then
            echo "::error::dist/ exists after a build whose npm failed, so the no-dist path was not exercised"
            exit 1
          fi

      - name: Run clippy
        run: cargo clippy -- -D warnings

      # The vacuity parser below is a COPY. Its source of record is
      # qontinui-claude-config/scripts/lib/cargo-vacuity.sh, which this runner
      # cannot reach, so the copy carries the source block's digest in its own
      # header and this step asserts the file still matches it. That catches
      # in-repo tampering; drift FROM the source is caught by
      # qontinui-claude-config's lint-cargo-verification-form.py wherever both
      # repos are checked out together. Neither half alone is a cross-repo gate,
      # and saying so is the point — plan
      # 2026-09-06-cross-repo-transcription-drift-has-no-ci-gate owns the general
      # mechanism. Plan 2026-09-06-rust-verification-green-but-vacuous, Phase 4.
      - name: The vacuity parser copy matches its declared digest
        run: |
          F=.github/scripts/cargo-vacuity-count.awk
          WANT=$(sed -n 's/^# source-sha256:[[:space:]]*//p' "$F" | head -1)
          [ -n "$WANT" ] || { echo "::error::$F carries no source-sha256 header"; exit 1; }
          GOT=$(awk '/^# >>> CARGO_VACUITY_AWK /{f=1;next} /^# <<< CARGO_VACUITY_AWK /{f=0} f' "$F" | sha256sum | cut -d" " -f1)
          echo "vacuity parser: declared ${WANT}, computed ${GOT}"
          [ "$WANT" = "$GOT" ] || { echo "::error::$F has been edited in place. Re-copy the block from qontinui-claude-config/scripts/lib/cargo-vacuity.sh and restamp the digest."; exit 1; }

      - name: Run tests
        run: |
          set +e
          # Every output this job captures and re-reads lives in $RUNNER_TEMP,
          # which the runner gives each job and empties, never at a fixed /tmp
          # path: on the self-hosted pool several jobs share one host, and a
          # shared file would let one job's census count another job's tests.
          cargo test 2>&1 | tee "$RUNNER_TEMP/cargo-test.out"
          SUBRC=${PIPESTATUS[0]}
          set -e

          # ── TEST-COUNT FLOOR ────────────────────────────────────────────
          # Plan 2026-09-06-rust-verification-green-but-vacuous, Phase 4.
          # A target-selection change can collapse this suite to a handful of
          # tests while the step still exits 0 and prints a plausible summary.
          # The floor is the only thing that sees that, and it is committed so
          # that LOWERING it shows up in a diff.
          #
          # The parser is `awk -f`, from a file this repo commits, because the
          # source of record lives in qontinui-claude-config and this runner
          # never checks it out. `awk` always exits 0 and always prints a
          # number; a `grep` here would exit non-zero on no match and, under
          # this shell's `pipefail`, abort the step in exactly the zero-tests
          # case the guard exists for.
          VACUITY=$(awk -f .github/scripts/cargo-vacuity-count.awk "$RUNNER_TEMP/cargo-test.out")
          RAN=${VACUITY%% *}
          SUMMARIES=${VACUITY##* }
          MIN_TESTS=1200

          # ── CRATE-TARGET FLOOR ──────────────────────────────────────────
          # SUMMARIES is the number of crate targets that printed a summary,
          # and the test floor above cannot see it shrink: a fail-fast abort
          # after the biggest targets, or a selection that keeps them and drops
          # the rest, still clears 1200 tests. Measured on run 36615898220
          # (main a1d0889, 2026-09-29): 2476 tests across 21 targets; the floor
          # is half, the same ratio as the test floor. Plan
          # 2026-09-20-rust-verification-residuals-cached-green-straddles-the-edit-target-count-unfloored-and-source-pins-scan-themselves,
          # Phase 3.
          MIN_TARGETS=10

          # ── A RED RUN IS STILL A READING ────────────────────────────────
          # Both floors are evaluated whatever cargo exited, and both facts are
          # printed, so a red run's log says how much of the suite it reached
          # rather than stopping at cargo's first error. A failing floor exits
          # with cargo's own status when that was already non-zero, so the
          # step's exit code is never laundered into a different one; and no
          # line here calls a red run's reading a pass.
          FAIL_RC=${SUBRC}
          [ "${FAIL_RC}" -ne 0 ] || FAIL_RC=1
          echo "supervisor cargo test: cargo exited ${SUBRC}; ${RAN} tests ran across ${SUMMARIES} summary line(s)" \
               "(floors: ${MIN_TESTS} tests, ${MIN_TARGETS} crate targets)"
          if [ "${SUMMARIES}" -eq 0 ]; then
            echo "::error::No test summary of either format was found in this run's output." \
                 "The command exited ${SUBRC} but produced no evidence that any test executed." \
                 "That is UNKNOWN, not a pass."
            exit "${FAIL_RC}"
          fi
          if [ "${SUBRC}" -eq 0 ]; then
            WHY="cargo exited 0, so this is a collapse, not a crash"
          else
            WHY="cargo exited ${SUBRC}, so the run is RED and stopped early; cargo's own error above is the cause, and this line records how much of the suite that run reached"
          fi
          FLOOR_MISSED=0
          if [ "${RAN}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Only ${RAN} tests ran (floor ${MIN_TESTS}). ${WHY}." \
                 "On a green exit it is almost certainly a target-selection change rather than" \
                 "deleted tests. Do NOT lower the floor to make this pass."
            FLOOR_MISSED=1
          fi
          if [ "${SUMMARIES}" -lt "${MIN_TARGETS}" ]; then
            echo "::error::Only ${SUMMARIES} of the suite's crate targets reported a summary" \
                 "(floor ${MIN_TARGETS}). ${WHY}. Fewer targets than the floor is a fail-fast" \
                 "abort or a target-selection collapse. Do NOT lower the floor."
            FLOOR_MISSED=1
          fi
          if [ "${FLOOR_MISSED}" -ne 0 ]; then
            exit "${FAIL_RC}"
          fi
          if [ "${SUBRC}" -ne 0 ]; then
            echo "::error::cargo test exited ${SUBRC}: this run is RED. It reached ${RAN} tests" \
                 "across ${SUMMARIES} crate targets, at or above both floors — which says how much" \
                 "of the suite ran, never that it passed. cargo's own error above is the cause."
          fi

          # ── THE CROSS-LANGUAGE PIN MUST ITSELF HAVE RUN ──────────────────
          # tests/orphan_kill_contract.rs is the only thing making the
          # EXPECTED_PRIMITIVES roster in the orphan-kill step below and the
          # exercised("…") names in tests/orphan_kill_unix.rs the same set. It
          # is an ordinary integration test, so it rides in THIS step — and
          # losing it costs a handful of tests out of a floor of 1200, which
          # the count above cannot see. Deleting or renaming that target would
          # therefore be SILENT, leaving the two files free to drift apart
          # again with nothing left to notice. That is the same
          # fail-open-on-deletion the exercised census was written to refuse,
          # one level up: applied to the refusal itself.
          #
          # This reads output the step already tee'd rather than adding a
          # `cargo test --test orphan_kill_contract` step of its own. cargo
          # recompiles the crate between targets in this job (~44s per re-run
          # step, measured on run 34045424390), and a pin costing a third of
          # those is a pin somebody eventually deletes for time.
          #
          # MIN_CONTRACT_TESTS is pinned from the RUST side —
          # `the_workflow_requires_this_pin_to_have_run` asserts it equals the
          # number of test attributes in that file — so raising it is part of
          # adding a test there, rather than a number that quietly stops
          # covering everything written after it.
          MIN_CONTRACT_TESTS=7
          CONTRACT=$(awk '
            {
              line = $0
              gsub(/\033\[[0-9;]*[a-zA-Z]/, "", line)
              sub(/\r$/, "", line)
              # cargo writes `Running tests/<name>.rs (…/<name>-<hash>)` and
              # only then hands the pipe to that binary, so the summary that
              # follows belongs to that target and to no other. Both streams
              # are merged into this file by the 2>&1 above.
              #
              # EVERY target header re-arms or DISARMS, rather than only ours
              # arming: a binary that dies before its harness prints anything
              # would otherwise leave the flag set and credit this target with
              # the NEXT one count — a number attributed to a run that did not
              # happen, which is the failure this census exists to name.
              # `Doc-tests <crate>` is a header too and gets the same treatment.
              if (line ~ /^ *(Running|Doc-tests) /) {
                armed = 0
                if (line ~ /orphan_kill_contract/) { found = 1; armed = 1 }
                next
              }
              # The SUMMARY line, not `running N tests`: libtest counts IGNORED
              # tests in that one, so an #[ignore] sweep over the pin would read
              # as a full run while asserting nothing — and the error below
              # promises to catch exactly that. passed+failed is also what the
              # sibling cargo-vacuity-count.awk sums, so the two censuses in
              # this step cannot disagree about what "ran" means. The `^` is a
              # deliberate TIGHTENING over that sibling, which matches
              # `/test result:/` anywhere: an indented summary inside a
              # captured-output block must not be credited to this target.
              if (armed && line ~ /^test result:/) {
                n = split(line, w, /[ \t]+/)
                for (i = 1; i < n; i++) {
                  if (w[i+1] ~ /^passed/) ran += w[i] + 0
                  if (w[i+1] ~ /^failed/) ran += w[i] + 0
                }
                armed = 0
              }
            }
            END { print (found ? 1 : 0), ran+0 }
          ' "$RUNNER_TEMP/cargo-test.out")
          CONTRACT_FOUND=${CONTRACT%% *}
          CONTRACT_RAN=${CONTRACT##* }
          # The reading must BE a reading before it is compared. Two failure
          # modes, and only one of them is already covered:
          #
          # * awk exits NON-ZERO (unopenable input; a parse error left by a
          #   later edit). `set -e` is active and the exit status of a BARE
          #   `VAR=$(cmd)` assignment is the substitution's, so the step already
          #   aborts here — measured, exit 2 — before this guard is reached.
          #   Keep the assignment bare: `export VAR=$(cmd)` and `local VAR=$(cmd)`
          #   both return 0 and would silently re-open this arm.
          # * awk exits ZERO without printing a usable pair — its END did not
          #   run, or its output grammar changed. NOTHING catches that: both
          #   numeric tests below then run as `[ "" -eq 0 ]`, which fails as a
          #   CONDITION rather than as a command, so `set -e` does NOT fire and
          #   the step falls through to `exit ${SUBRC}` reporting green. This
          #   guard exists for that arm.
          #
          # Each field is checked WHOLLY. `[0-9]*` anchors one character and
          # then `*` swallows the rest, so a digit-prefixed non-number — `1x`,
          # exactly what a half-broken program emits — passed a combined
          # `[0-9]*:[0-9]*` and fell through to green.
          #
          # An unreadable census is UNKNOWN, never a pass.
          for reading in "${CONTRACT_FOUND}" "${CONTRACT_RAN}"; do
            case "${reading}" in
              ''|*[!0-9]*)
                echo "::error::The orphan_kill_contract census produced no usable reading" \
                     "(awk printed '${CONTRACT}'; this field was '${reading}'). That is" \
                     "UNKNOWN, not a pass. awk exited 0 here — a non-zero exit aborts the" \
                     "assignment above under set -e and never reaches this — so its END block" \
                     "did not run, or its output grammar changed. This is a fault in the" \
                     "census, not a verdict about the pin. Fix the census."
                exit "${FAIL_RC}" ;;
            esac
          done
          echo "supervisor orphan_kill_contract: target ran ${CONTRACT_FOUND}, ${CONTRACT_RAN} tests (floor ${MIN_CONTRACT_TESTS})"
          if [ "${CONTRACT_FOUND}" -eq 0 ]; then
            echo "::error::This run shows no orphan_kill_contract target. That file is the" \
                 "ONLY thing keeping EXPECTED_PRIMITIVES below in step with the" \
                 "exercised(\"…\") names in tests/orphan_kill_unix.rs, and it is small enough" \
                 "to vanish inside the ${MIN_TESTS}-test floor above without moving it, so" \
                 "the likely cause is that it was deleted or renamed: restore it. The other" \
                 "cause is that this step stopped emitting libtest grammar — a switch to" \
                 "nextest prints neither 'Running <target>' nor 'running N tests', and this" \
                 "census reads only those. If that is what changed, EXTEND the census to the" \
                 "new grammar (cargo-vacuity-count.awk reads both); do not delete it, which" \
                 "would make the next real deletion silent again. Third cause: cargo itself" \
                 "exited ${SUBRC}, and a non-zero value there means the target failed to" \
                 "BUILD — cargo own error above is then what to read, not this message."
            exit "${FAIL_RC}"
          fi
          if [ "${CONTRACT_RAN}" -lt "${MIN_CONTRACT_TESTS}" ]; then
            echo "::error::The orphan_kill_contract target ran ${CONTRACT_RAN} test(s)," \
                 "floor ${MIN_CONTRACT_TESTS}. The target survived with tests removed or" \
                 "ignored, so the pin compiled without asserting what it claims to. Restore" \
                 "them; lowering this floor un-gates the cross-language contract it proves." \
                 "cargo itself exited ${SUBRC}; a non-zero value there with a count of 0" \
                 "means the binary DIED before its harness printed anything, and cargo's" \
                 "own error above is the cause rather than removed tests."
            exit "${FAIL_RC}"
          fi
          exit "${SUBRC}"
        env:
          QONTINUI_RUNNER_FLEET_RS: ${{ github.workspace }}/.runner-roster/src-tauri/src/fleet.rs
          QONTINUI_RUNNER_INSTANCE_ENV_RS: ${{ github.workspace }}/.runner-roster/src-tauri/src/instance_env.rs

      # `cargo test` swallows stdout for tests that pass, so the two cross-repo
      # checks' verdicts would leave no artifact in the CI log, and a control
      # that leaves no artifact cannot be audited. Re-run just these two
      # binaries with --nocapture so the evidence is recorded:
      #   - machine_local_artifacts: which source the roster cross-check read,
      #     and at which sha;
      #   - root_confined_env_keys: which runner instance_env.rs it read, and
      #     "all N runner keys present in the M-key copy" (or the keys the
      #     runner has since dropped, which it reports rather than fails).
      # Both run in ONE cargo invocation, so they share one compile rather than
      # adding a second re-run step.
      #
      # It is NOT, however, "already compiled by the step above, so this costs
      # milliseconds" — that was this comment's original claim and it is wrong.
      # Measured on run 34045424390 (2026-09-06): cargo recompiles the crate
      # between `cargo test` targets in this job, and this step reported
      # `Finished ... in 44.01s`. The re-run is still worth ~44s; the number is
      # now measured rather than assumed. The recompile itself is a separate
      # defect (~90s per run across the two re-run steps) and is not fixed here.
      - name: Record the machine-local artifact roster and root-confined key verdicts
        run: |
          # `--test <target>` is a TARGET selector and cargo errors on an unknown
          # target, so this step is already fail-closed against a target
          # disappearing. The residual it is NOT closed against is a target
          # surviving with every #[test] removed — exit 0, "0 passed", and a step
          # whose own name claims a verdict was recorded. That is what the
          # per-target count assertions below cover. Each floor is 1: both
          # targets hold a handful of tests (5 and 2 on 2026-10-25) and a number
          # pretending to be tighter would be made up rather than measured.
          #
          # --no-fail-fast: without it cargo stops after the first failing test
          # binary, the second prints no summary, and the per-target check would
          # blame the step's wiring for what is really the first binary's red.
          set +e
          cargo test --no-fail-fast --test machine_local_artifacts --test root_confined_env_keys -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo-mla.out"
          SUBRC=${PIPESTATUS[0]}
          set -e

          # ── TEST-COUNT FLOOR, PER TARGET ────────────────────────────────
          # Plan 2026-09-06-rust-verification-green-but-vacuous, Phase 4.
          # A target-selection change can collapse a suite to nothing while the
          # step still exits 0 and prints a plausible summary. The floor is the
          # only thing that sees that, and it is committed so that LOWERING it
          # shows up in a diff.
          #
          # The floor is applied to EACH target's own section of the output (from
          # its `Running tests/<target>.rs` line to the next `Running` line), not
          # to the sum: summed, one target's 2 tests would hide the other being
          # emptied, since an emptied binary still prints a `0 passed` summary.
          # The job sets CARGO_TERM_COLOR=always, so cargo wraps `Running` in
          # ANSI codes; the extractor strips them before matching, as the shared
          # vacuity awk does. A test that itself printed a line starting with
          # `Running ` would end its target's section early — neither does
          # today, and the result would be a red step, never a silent pass.
          #
          # The parser is `awk -f`, from a file this repo commits, because the
          # source of record lives in qontinui-claude-config and this runner
          # never checks it out. `awk` always exits 0 and always prints a
          # number; a `grep` here would exit non-zero on no match and, under
          # this shell's `pipefail`, abort the step in exactly the zero-tests
          # case the guard exists for.
          MIN_TESTS=1
          for TARGET in machine_local_artifacts root_confined_env_keys; do
            awk -v t="${TARGET}" '
              { l = $0; gsub(/\033\[[0-9;]*[a-zA-Z]/, "", l) }
              l ~ /^[ \t]*Running / { f = (l ~ ("tests.?" t "[.]rs")); next }
              f' "$RUNNER_TEMP/cargo-mla.out" > "$RUNNER_TEMP/cargo-${TARGET}.out"
            VACUITY=$(awk -f .github/scripts/cargo-vacuity-count.awk "$RUNNER_TEMP/cargo-${TARGET}.out")
            RAN=${VACUITY%% *}
            SUMMARIES=${VACUITY##* }
            echo "supervisor ${TARGET}: ${RAN} tests ran across ${SUMMARIES} summary line(s) (floor ${MIN_TESTS} tests)"
            if [ "${SUMMARIES}" -eq 0 ]; then
              echo "::error::No test summary of either format was found for ${TARGET} in this run's output." \
                   "The command exited ${SUBRC} but produced no evidence that this target executed." \
                   "That is UNKNOWN, not a pass."
              exit 1
            fi
            if [ "${RAN}" -lt "${MIN_TESTS}" ]; then
              echo "::error::Only ${RAN} ${TARGET} tests ran (floor ${MIN_TESTS}). The step exited" \
                   "${SUBRC} but the target collapsed — almost certainly a target-selection change" \
                   "or tests removed from the file. Do NOT lower the floor to make this pass."
              exit 1
            fi
          done
          exit "${SUBRC}"
        env:
          QONTINUI_RUNNER_FLEET_RS: ${{ github.workspace }}/.runner-roster/src-tauri/src/fleet.rs
          QONTINUI_RUNNER_INSTANCE_ENV_RS: ${{ github.workspace }}/.runner-roster/src-tauri/src/instance_env.rs

      # Same reason, for the orphan-kill suite — and here the silence is not
      # merely unaudited, it is a green that can mean the suite never ran.
      # Every one of its three tests SKIPS rather than fails on an environmental
      # unknown, by design: the port is already in use, `python3` could not be
      # spawned or exited before binding, or the `lsof` probe could not run at
      # all (`Err` is UNKNOWN, never "nothing was listening"). Each skip prints
      # its reason and then returns, so the test passes — and `cargo test`
      # swallows stdout for a passing test, leaving a green that is
      # indistinguishable from three real runs against a real listener.
      #
      # These are the only tests in this repo that exercise the D7 kill
      # primitives against a live OS process, so "did they actually run" is the
      # question the suite exists to answer. --nocapture puts each skip reason
      # in the log where it can be read.
      #
      # RECORDING THE REASONS IS NOT ENOUGH, and this step used to stop there.
      # A reason in a log is evidence only to a reader who happens to scroll to
      # it, and the failure this suite exists to catch is exactly the one nobody
      # scrolls for. Measured on the run that first executed this step
      # (34045424390, 2026-09-06): all three tests ran against a real listener
      # and printed no skip at all — so the log carried no signal, the step
      # printed green, and a run in which all three had skipped would have looked
      # identical. The two assertions below close that.
      #
      # COST, corrected: this step is NOT free. That same run measured it at
      # 44.04s — cargo recompiles the crate between `cargo test` targets here —
      # and the sibling step above at 44.01s for the same reason. The claim that
      # it "costs milliseconds" was inherited, not measured; the steps are still
      # worth their ~44s, but the number is stated rather than guessed.
      - name: Record the orphan-kill suite's skip reasons
        run: |
          set +e
          cargo test --test orphan_kill_unix -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo-orphan.out"
          SUBRC=${PIPESTATUS[0]}
          set -e

          # ── THE PRIMITIVE ROSTER ────────────────────────────────────────
          # One name per D7 kill primitive, and the SINGLE declaration that
          # drives both assertions below — the floor is derived from its length
          # rather than written out again, so the two can never disagree.
          #
          # It is not free text. Every name here must be announced by an
          # `exercised("…")` call in tests/orphan_kill_unix.rs and vice versa,
          # which tests/orphan_kill_contract.rs asserts as an ordinary test in
          # the `Run tests` step above — so a rename, an addition or a deletion
          # reds on a developer's own box, naming the drift, instead of arriving
          # here as a census that reads short and blames the CI runner.
          EXPECTED_PRIMITIVES="kill_by_port kill_by_pid_tree find_pid_on_port"
          MIN_TESTS=$(echo ${EXPECTED_PRIMITIVES} | wc -w | tr -d ' ')

          # ── TEST-COUNT FLOOR ────────────────────────────────────────────
          # Same parser and same reasoning as the two steps above: `awk` always
          # exits 0 and always prints a number, where a `grep` would exit
          # non-zero on no match and, under this shell's pipefail, abort the step
          # in exactly the zero-tests case the guard exists for.
          VACUITY=$(awk -f .github/scripts/cargo-vacuity-count.awk "$RUNNER_TEMP/cargo-orphan.out")
          RAN=${VACUITY%% *}
          SUMMARIES=${VACUITY##* }
          # No crate-target floor above 1, by choice: `--test orphan_kill_unix`
          # selects ONE target, so there is no suite to collapse (plan 2026-09-20-rust-verification-residuals-…, Phase 3).
          MIN_TARGETS=1
          echo "supervisor orphan_kill_unix: ${RAN} tests ran across ${SUMMARIES} summary line(s) (floor ${MIN_TESTS} tests, ${MIN_TARGETS} target)"
          if [ "${SUMMARIES}" -eq 0 ]; then
            echo "::error::No test summary of either format was found in this run's output." \
                 "The command exited ${SUBRC} but produced no evidence that any test executed." \
                 "That is UNKNOWN, not a pass."
            exit 1
          fi
          if [ "${RAN}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Only ${RAN} tests ran (floor ${MIN_TESTS}). Unlike the floors above" \
                 "this one is not a round number below the measurement: the target holds one" \
                 "test per D7 kill primitive (${EXPECTED_PRIMITIVES}) and losing any of them" \
                 "loses that primitive's only live-process coverage. Do NOT lower the floor to" \
                 "make this pass — it is derived from the roster above, so lowering it means" \
                 "dropping a primitive."
            exit 1
          fi

          # ── EXERCISED CENSUS, BY NAME ───────────────────────────────────
          # The floor above sees a target that COLLAPSED. It cannot see the
          # failure this suite is actually exposed to: all three tests present,
          # all three running, all three SKIPPING on an environmental unknown
          # (port busy, no python3, an `lsof` that cannot run) and reporting
          # "3 passed". Each skip is correct in the test — an unrunnable probe is
          # UNKNOWN about the kill primitives, not a verdict on them — but on
          # ubuntu-latest or the self-hosted pool an UNKNOWN here is a broken
          # runner, not a fact to accept, and the point of this step is that the
          # primitives were exercised. One pool-only cause is not a broken
          # runner: every registration on the host shares its network, so a
          # concurrent job there can hold one of the ports. A re-run goes hosted.
          #
          # The census counts POSITIVE evidence, never skips. A skip census would
          # fail OPEN — delete the skip calls, rename the marker, or delete the
          # tests and it reads zero and reports green. Requiring the
          # ORPHAN_KILL_EXERCISED announcements fails CLOSED on every one of
          # those paths. The markers are defined in tests/orphan_kill_unix.rs,
          # one printed as the last act of each test after all of its assertions
          # have passed.
          #
          # BY NAME, not by count, and that distinction is the assertion. Each
          # announcement carries the primitive it covers; counting the lines
          # threw that payload away and asserted something weaker than this
          # step's own contract. Three lines is not three primitives — two
          # announcements of `kill_by_port` plus one of `kill_by_pid_tree`
          # totals three while `find_pid_on_port` was never exercised at all,
          # and a count reports that as green. Requiring each NAME on the roster
          # is the check the message below has always claimed to be making, and
          # it says which primitive is missing instead of only how many.
          EXERCISED=$(awk '
            {
              line = $0
              gsub(/\033\[[0-9;]*[a-zA-Z]/, "", line)
              sub(/\r$/, "", line)
              tag = "ORPHAN_KILL_EXERCISED: "
              at = index(line, tag)
              if (at > 0) {
                name = substr(line, at + length(tag))
                sub(/[^A-Za-z0-9_].*$/, "", name)
                if (name != "") seen[name] = 1
              }
            }
            END { for (n in seen) print n }
          ' "$RUNNER_TEMP/cargo-orphan.out" | sort | tr '\n' ' ')
          EXERCISED=${EXERCISED% }
          echo "supervisor orphan_kill_unix: exercised [${EXERCISED}] against a live listener (roster: ${EXPECTED_PRIMITIVES})"

          # Both directions are a set-membership test, so pad BOTH haystacks on
          # both sides and match on " <name> ". Leaning on the separator `tr`
          # happens to leave behind would work today and is a trap for the next
          # editor; an empty EXERCISED collapses to "  " and matches nothing,
          # which is the correct reading of "no primitive was exercised".
          HAVE=" ${EXERCISED} "
          WANT=" ${EXPECTED_PRIMITIVES} "

          MISSING=""
          for p in ${EXPECTED_PRIMITIVES}; do
            case "${HAVE}" in
              *" ${p} "*) ;;
              *) MISSING="${MISSING} ${p}" ;;
            esac
          done
          UNGATED=""
          for p in ${EXERCISED}; do
            case "${WANT}" in
              *" ${p} "*) ;;
              *) UNGATED="${UNGATED} ${p}" ;;
            esac
          done

          if [ -n "${MISSING}" ]; then
            echo "::error::These D7 kill primitives were NOT exercised against a live OS" \
                 "process:${MISSING}. The suite exited ${SUBRC} and ran ${RAN} tests;" \
                 "whatever that exit code says, those primitives were not tested, which is" \
                 "UNKNOWN rather than a pass. Any reason a test gave for declining is listed" \
                 "below. On ubuntu-latest and on the self-hosted pool all of them should run:" \
                 "python3, lsof and ports 9896-9898 are all expected to be available (on the" \
                 "pool ${RUNNER_NAME:-?} shares the host's network with its other registrations," \
                 "so a concurrent job can hold a port; a re-run goes hosted). Fix the runner" \
                 "(or the test), never this roster."
            awk '/ORPHAN_KILL_SKIP: /{print "  " $0}' "$RUNNER_TEMP/cargo-orphan.out"
            exit 1
          fi
          if [ -n "${UNGATED}" ]; then
            echo "::error::The suite announced primitives this roster does not require:" \
                 "${UNGATED}. An unlisted primitive is UNGATED — it may skip on every future" \
                 "run and this census would stay green, because a census asserts the names it" \
                 "was given. Add it to EXPECTED_PRIMITIVES above; do not delete the" \
                 "announcement. tests/orphan_kill_contract.rs asserts the two stay in step and" \
                 "should have failed in the 'Run tests' step before this one ran."
            exit 1
          fi
          exit "${SUBRC}"

      - name: Build
        run: cargo build

  # The pin script's refusals are the whole safety property (a missing or
  # malformed pin must never degrade to "fetch main"), so they are tested here.
  ci-scripts-tests:
    name: CI script tests
    # Routed like Rust Check: see `route` and Rust Check's `runs-on`.
    needs: route
    if: ${{ !cancelled() }}
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON((github.run_attempt == 1 && github.event_name != 'pull_request' && vars.SUPERVISOR_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]') || (github.run_attempt == 1 && needs.route.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # SELF-HOSTED ONLY: a HOME and TMPDIR of the job's own, as in Rust Check
      # (every registration on the host shares one account and one home).
      - name: "Self-hosted: own HOME and TMPDIR"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/tmp"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"
          echo "HOME -> $RUNNER_TEMP/home"
      - name: Schemas sibling pin tests
        run: bash .github/scripts/test-schemas-pin.sh
      - name: Pre-commit cargo target-dir tests
        run: bash .github/scripts/test-pre-commit-cargo.sh
      # The pool label set is spelled in several places (see Rust Check's
      # `runs-on`). Drift there makes the router count no pool jobs, so a dead
      # pool reads healthy and the hosted floor never takes over, silently.
      - name: Pool label set is spelled the same everywhere
        run: |
          bash .github/scripts/test-ci-lane-labels.sh
          python3 -I -B .github/scripts/check-ci-lane-labels.py .github/workflows/ci.yml

  compose-parity:
    name: Compose Parity (cross-repo fixture drift)
    # Routed like Rust Check: see `route` and Rust Check's `runs-on`. Its
    # `cargo test compose_parity` compiles every test target, the build the
    # ram-16g class was measured on.
    needs: route
    if: ${{ !cancelled() }}
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON((github.run_attempt == 1 && github.event_name != 'pull_request' && vars.SUPERVISOR_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]') || (github.run_attempt == 1 && needs.route.outputs.labels) || '["ubuntu-latest"]') }}

    # Enforces the supervisor-side half of the load-bearing invariant that
    # qontinui-supervisor/src/cache_key.rs::compose and
    # qontinui-coord/src/ac_gate.rs::compose stay byte-identical: the coord
    # AC-freshness gate looks build-cache keys up in the same bazel-remote
    # Action Cache this pool writes, so if the two compose() impls drift,
    # coord's lookups miss every entry the pool wrote and the optimization
    # silently degrades to a permanent 0% hit rate.
    #
    # The invariant has two halves:
    #   1. each repo's compose() reproduces its LOCAL compose_parity.json
    #      fixture (the `compose_parity::matches_canonical_fixture` unit test
    #      in each repo), and
    #   2. the two fixtures are byte-identical to each other (cross-repo).
    #
    # This job owns half 1 for the supervisor: it runs the in-repo
    # `compose_parity` unit test asserting supervisor's compose() == its
    # local fixture.
    #
    # Half 2 (cross-repo byte-identity) is NO LONGER done here. supervisor is
    # a PUBLIC repo but qontinui-coord is now PRIVATE, and GitHub serves a 404
    # for private raw.githubusercontent.com content to anonymous clients. The
    # old curl-from-raw fetch therefore failed on every supervisor PR, and we
    # deliberately do not add a cross-repo PAT secret (the default GITHUB_TOKEN
    # cannot read another private repo either). The direction is flipped: coord
    # now has its own CI which CAN fetch supervisor's PUBLIC fixture
    # unauthenticated and assert byte-identity there. So the cross-repo check
    # lives in coord's CI; this job is secret-free.
    #
    # FIX on drift: update BOTH compose() impls AND regenerate
    # tests/fixtures/compose_parity.json in BOTH repos in lockstep.
    # See memory proj_row_10_item_8_ac_gate.

    steps:
      - name: Checkout qontinui-supervisor
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # SELF-HOSTED ONLY. The same step as Rust Check's, which says why each
      # part exists; keep the two identical. The persistent target is keyed by
      # registration, not by job, so whichever of the two jobs a registration
      # ran last left it warm for the other.
      - name: "Self-hosted: host check, own HOME and rustup, compile caps and the persistent target"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for tool in cc git curl python3 lsof npm; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error title=self-hosted host not provisioned::runner '$RUNNER_NAME' lacks:$missing. The HOST is at fault, not this change: provision it. A re-run goes to the hosted floor; SUPERVISOR_CI_LINUX_LANE=hosted keeps new runs off the pool."
            exit 1
          fi

          pool_home="$HOME"
          state="$pool_home/.cache/qontinui-supervisor-ci/$RUNNER_NAME"
          job_home="$RUNNER_TEMP/home"
          mkdir -p "$state/rustup" "$job_home" "$RUNNER_TEMP/tmp"

          budget_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          cg="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "$cg" != "/sys/fs/cgroup" ] && [ -n "$cg" ]; do
            for f in memory.max memory.high; do
              v=$(cat "$cg/$f" 2>/dev/null || echo max)
              case "$v" in ''|*[!0-9]*) continue ;; esac
              if [ $((v / 1024)) -lt "$budget_kb" ]; then budget_kb=$((v / 1024)); fi
            done
            cg="${cg%/*}"
          done
          cpus=$(nproc)
          jobs=$(( budget_kb / 3145728 ))
          [ "$budget_kb" -gt 8388608 ] || jobs=1
          [ "$jobs" -ge 1 ] || jobs=1
          [ "$jobs" -le "$cpus" ] || jobs=$cpus
          threads=4
          [ "$threads" -le "$cpus" ] || threads=$cpus

          {
            echo "CARGO_HOME=${CARGO_HOME:-$pool_home/.cargo}"
            echo "RUSTUP_HOME=$state/rustup"
            echo "HOME=$job_home"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "CARGO_BUILD_JOBS=$jobs"
            echo "RUST_TEST_THREADS=$threads"
          } >> "$GITHUB_ENV"
          echo "HOME -> $job_home; CARGO_HOME stays in $pool_home; RUSTUP_HOME and the target are this registration's, under $state"
          echo "memory budget $((budget_kb / 1048576)) GiB, nproc $cpus -> CARGO_BUILD_JOBS=$jobs RUST_TEST_THREADS=$threads"

          cache="$state/target"
          mkdir -p "$cache"
          if ! used_kb=$(du -sk "$cache" 2>/dev/null | cut -f1) || [ -z "$used_kb" ]; then
            echo "::notice title=persistent target reset::du could not read $cache: starting cold"
            chmod -R u+rwX "${cache:?}" 2>/dev/null || true
            rm -rf "${cache:?}"
            mkdir -p "$cache"
            used_kb=0
          fi
          free_kb=$(df -Pk "$cache" | awk 'NR == 2 {print $4}')
          if [ "$used_kb" -gt $((40 * 1048576)) ] || [ "$free_kb" -lt $((60 * 1048576)) ]; then
            echo "::notice title=persistent target reset::$((used_kb / 1048576)) GiB used, $((free_kb / 1048576)) GiB free on its filesystem: starting cold"
            chmod -R u+rwX "${cache:?}" 2>/dev/null || true
            rm -rf "${cache:?}"
            mkdir -p "$cache"
            used_kb=0
          fi
          if [ -e target ] && [ ! -L target ]; then rm -rf target; fi
          ln -sfn "$cache" target
          echo "target -> $cache ($((used_kb / 1048576)) GiB already built)"

      # qontinui-supervisor's Cargo.toml declares qontinui-types as a path: dep
      # at ../qontinui-schemas/rust. Without the sibling checkout, the build
      # fails with "failed to read ../qontinui-schemas/rust/Cargo.toml".
      # PINNED to .github/sibling-pins.conf, same as rust-check, and on the
      # pool reused and retried the same way (see Rust Check's step).
      - name: Checkout sibling repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A refusal of the pin itself fails here, with the copy untouched.
          bash .github/scripts/schemas-pin.sh read > /dev/null
          rc=0
          bash .github/scripts/schemas-pin.sh checkout "$GITHUB_WORKSPACE/.." || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=schemas sibling checkout failed::exit $rc; removing ../qontinui-schemas and retrying once"
            rm -rf "${GITHUB_WORKSPACE:?}/../qontinui-schemas"
            bash .github/scripts/schemas-pin.sh checkout "$GITHUB_WORKSPACE/.."
          fi

      # Pin matches rust-toolchain.toml (channel = "1.95.0"). The toolchain
      # file overrides any other channel for every cargo invocation.
      - name: Install Rust 1.95.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # Hosted only, for the reasons on Rust Check's identical step.
      - name: Cache cargo dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Assert compose() reproduces the local parity fixture
        run: |
          # A BARE NAME FILTER. Rename `compose_parity`, or cfg-gate it away, and
          # this step runs 0 tests and exits 0 while its own name asserts a
          # guarantee — the step would keep passing having asserted nothing.
          # Measured 2026-09-06: 2 tests match. The floor is 1 rather than 2 so a
          # legitimate consolidation does not red the step; what it catches is
          # the filter matching NOTHING, which is the failure that is silent.
          set +e
          cargo test compose_parity 2>&1 | tee "$RUNNER_TEMP/cargo-parity.out"
          SUBRC=${PIPESTATUS[0]}
          set -e

          # ── TEST-COUNT FLOOR ────────────────────────────────────────────
          # Plan 2026-09-06-rust-verification-green-but-vacuous, Phase 4.
          # A target-selection change can collapse this suite to a handful of
          # tests while the step still exits 0 and prints a plausible summary.
          # The floor is the only thing that sees that, and it is committed so
          # that LOWERING it shows up in a diff.
          #
          # The parser is `awk -f`, from a file this repo commits, because the
          # source of record lives in qontinui-claude-config and this runner
          # never checks it out. `awk` always exits 0 and always prints a
          # number; a `grep` here would exit non-zero on no match and, under
          # this shell's `pipefail`, abort the step in exactly the zero-tests
          # case the guard exists for.
          VACUITY=$(awk -f .github/scripts/cargo-vacuity-count.awk "$RUNNER_TEMP/cargo-parity.out")
          RAN=${VACUITY%% *}
          SUMMARIES=${VACUITY##* }
          MIN_TESTS=1
          # No crate-target floor above 1, by choice. The name filter still runs
          # every target (20 summaries on run 36615898220, 2026-09-29), but this
          # step guards the NAMED tests; suite coverage is the Rust Check job's
          # floor, not this one's (plan 2026-09-20-rust-verification-residuals-…, Phase 3).
          MIN_TARGETS=1
          echo "supervisor compose_parity: ${RAN} tests ran across ${SUMMARIES} summary line(s) (floor ${MIN_TESTS} tests, ${MIN_TARGETS} target)"
          if [ "${SUMMARIES}" -eq 0 ]; then
            echo "::error::No test summary of either format was found in this run's output." \
                 "The command exited ${SUBRC} but produced no evidence that any test executed." \
                 "That is UNKNOWN, not a pass."
            exit 1
          fi
          if [ "${RAN}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Only ${RAN} tests ran (floor ${MIN_TESTS}). The step exited 0 but the" \
                 "suite collapsed — almost certainly a target-selection change rather than" \
                 "deleted tests. Do NOT lower the floor to make this pass."
            exit 1
          fi
          exit "${SUBRC}"

  frontend-check:
    name: Frontend Check
    # Routed like Rust Check: see `route` and Rust Check's `runs-on`.
    needs: route
    if: ${{ !cancelled() }}
    # coord-pools: [self-hosted, Linux, X64, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON((github.run_attempt == 1 && github.event_name != 'pull_request' && vars.SUPERVISOR_CI_LINUX_LANE == 'self-hosted' && '["self-hosted","Linux","X64","ram-16g"]') || (github.run_attempt == 1 && needs.route.outputs.labels) || '["ubuntu-latest"]') }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout qontinui-supervisor
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # SELF-HOSTED ONLY: a HOME and TMPDIR of the job's own, as in Rust Check
      # (every registration on the host shares one account and one home). npm's
      # cache is under HOME, so on the pool it is this job's own and empty.
      - name: "Self-hosted: own HOME and TMPDIR"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/tmp"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"
          echo "HOME -> $RUNNER_TEMP/home"

      # On the pool setup-node takes Node 20 from the host's shared tool cache
      # (downloaded there once; the host's own /usr/bin/node is v22.23.4,
      # `node --version` on nawa 2026-11-03). The npm
      # CACHE is hosted-only: on the pool a restore would land in a per-job
      # HOME nobody keeps, and a save would put a pool-built entry into this
      # repo's Actions cache. `package-manager-cache` is pinned too, so a
      # `packageManager` field added to a package.json later cannot turn
      # setup-node v5's automatic caching back on for the pool.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        if: always()

      - name: Format check
        run: npm run format:check
        if: always()

      - name: Test
        run: npm test
        if: always()

      - name: Build
        run: npm run build
